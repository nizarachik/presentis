<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--y:#ffd21f;--y2:#ffb800;--bg:#0d0f14;--card:rgba(24,27,34,.82);--bd:#2c313c;--mut:#9aa1b2;--ko:#ff6b6b;--ok:#4ade80}
html,body{min-height:100%}
body{margin:0;color:#f3f4f6;font:16px/1.45 ui-rounded,"SF Pro Rounded","Nunito","Quicksand","Segoe UI Variable Text","Segoe UI","Noto Sans Arabic",system-ui,-apple-system,sans-serif;display:flex;justify-content:center;align-items:stretch;padding:0;
background:radial-gradient(900px 500px at 15% -10%,rgba(255,210,31,.22),transparent 60%),radial-gradient(700px 500px at 100% 110%,rgba(255,184,0,.16),transparent 60%),var(--bg)}
.c{width:100%;max-width:none;margin:0;min-height:100vh;background:var(--card);border:0;border-radius:0;padding:26px 20px 30px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 30px 70px -30px rgba(255,200,30,.35),inset 0 1px 0 rgba(255,255,255,.06)}
.sl{display:flex;gap:6px;justify-content:center;margin-bottom:12px}
.sl button{width:auto;margin:0;padding:7px 14px;font-size:13px;font-weight:600;background:transparent;color:var(--mut);border:1px solid var(--bd);border-radius:999px;box-shadow:none}
.sl button.on{background:linear-gradient(135deg,var(--y),var(--y2));color:#1b1500;border-color:transparent}
.br{text-align:center;margin-bottom:8px}.br img{height:84px;filter:drop-shadow(0 8px 18px rgba(255,200,30,.35))}.br div{font-family:"Avenir Next","Century Gothic","Poppins","Trebuchet MS","Segoe UI Variable Display","Noto Sans Arabic",system-ui,sans-serif;font-size:30px;line-height:1.1;color:var(--y);letter-spacing:.3px;font-weight:500;margin-top:2px}.br span{color:var(--mut);font-weight:400;font-size:20px}
h1{font-size:22px;margin:6px 0 4px;text-align:center}.s{color:var(--mut);font-size:14px;margin:0 0 6px;text-align:center}
.fld{margin-top:14px}
label{display:block;font-size:13px;font-weight:600;color:var(--mut);margin:0 0 5px}
input,select{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--bd);background:#0c0e13;color:#fff;font:inherit;outline:0;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus{border-color:var(--y);box-shadow:0 0 0 3px rgba(255,210,31,.18)}
input.bad,select.bad{border-color:var(--ko);box-shadow:0 0 0 3px rgba(255,107,107,.15)}
input.good,select.good{border-color:rgba(74,222,128,.6)}
#m{text-transform:uppercase;letter-spacing:1.5px;font-variant-numeric:tabular-nums}
.r{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.r .fld{margin-top:14px;min-width:0}
.fe{display:block;color:var(--ko);font-size:12.5px;min-height:0;margin-top:5px}.fe:empty{display:none}
.hint{display:block;color:var(--mut);font-size:12px;margin-top:4px}
.imc{margin-top:14px;padding:10px 12px;border:1px dashed var(--bd);border-radius:12px;color:var(--mut);font-size:13.5px;text-align:center;display:none}.imc b{color:var(--y)}
button{width:100%;margin-top:16px;padding:14px;border:0;border-radius:13px;background:linear-gradient(135deg,var(--y),var(--y2));color:#1b1500;font-family:inherit;font-weight:700;font-size:16px;cursor:pointer;box-shadow:0 12px 26px -12px rgba(255,200,30,.8);transition:transform .12s,filter .12s}
button:hover{filter:brightness(1.05)}button:active{transform:scale(.985)}
button.g{background:transparent;color:var(--y);border:1px solid rgba(255,210,31,.55);box-shadow:none}
.e{color:var(--ko);font-size:14px;min-height:0;margin-top:10px;text-align:center}
#o,#dn{display:none;text-align:center}
#oks{background:rgba(255,210,31,.08);border:1px solid rgba(255,210,31,.3);border-radius:14px;padding:12px 14px;color:#f6e9b0;font-size:15px;font-weight:500;line-height:1.5}
textarea{width:100%;height:96px;margin-top:8px;padding:10px;border-radius:12px;border:1px solid var(--bd);background:#0c0e13;color:#fff;font:12px monospace}
.ok{color:var(--ok);font-weight:700}
.chk{width:92px;height:92px;margin:8px auto 6px;display:block;overflow:visible;animation:pp .5s cubic-bezier(.2,1.3,.4,1) both}
.chk .rg{fill:rgba(34,197,94,.1);stroke:#22c55e;stroke-width:2.6}
.chk .tk{fill:none;stroke:#22c55e;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
@keyframes pp{from{transform:scale(.7)}to{transform:scale(1)}}
.cnt{color:var(--mut);font-size:13px;margin-top:10px}
.bk{display:block;width:max-content;margin:18px auto 0;font-family:ui-rounded,"SF Pro Rounded","Nunito","Quicksand","Segoe UI Variable Text","Noto Sans Arabic",system-ui,sans-serif;font-size:14px;font-weight:600;color:var(--y);cursor:pointer;text-decoration:none;padding:8px 16px;border:1px solid rgba(255,210,31,.45);border-radius:999px;transition:.15s}.bk:hover{background:rgba(255,210,31,.1)}
.c>*{max-width:540px;margin-left:auto;margin-right:auto}
@media(max-width:380px){.r{grid-template-columns:1fr 1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet"></head>
